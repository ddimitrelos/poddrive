name: Android CI

on:
  push:
    branches: [ master ]
    paths:
      - 'poddrive/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'poddrive/**'
      - '.github/workflows/android-ci.yml'

defaults:
  run:
    working-directory: poddrive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('poddrive/gradle/libs.versions.toml', 'poddrive/**/*.gradle.kts', 'poddrive/gradle/wrapper/gradle-wrapper.properties', 'poddrive/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Run androidApp unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Run shared unit tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: poddrive/androidApp/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: poddrive/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

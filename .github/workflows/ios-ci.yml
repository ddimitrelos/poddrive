name: iOS CI

on:
  push:
    branches: [ master ]
    paths:
      - 'poddrive/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'poddrive/**'
      - '.github/workflows/ios-ci.yml'

defaults:
  run:
    working-directory: poddrive

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('poddrive/gradle/libs.versions.toml', 'poddrive/**/*.gradle.kts', 'poddrive/gradle/wrapper/gradle-wrapper.properties', 'poddrive/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build XCFramework
        run: ./gradlew :shared:assembleXCFramework --stacktrace

      - name: Build iOS app (simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.5" \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

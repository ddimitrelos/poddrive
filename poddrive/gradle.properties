org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Required: Android CI runs :shared:testDebugUnitTest on ubuntu-latest where iOS
# Kotlin/Native targets are disabled. Without this flag the configuration phase
# fails on Linux. iOS targets are always enabled on the macos-latest iOS CI runner.
kotlin.native.ignoreDisabledTargets=true
# Suppress KMP/AGP version compatibility notice (AGP 8.13.2 > max-tested 8.5, but builds fine)
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
